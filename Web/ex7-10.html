<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>리터럴 표기법으로 객체 만들기</title>
    <script>
        let account = {
            owner : "안태호",
            code : "111",
            balance : 35000,

            inquiry : function(){
                return this.balance;
            },
            deposit : function(money){
                this.balance += money;
            },
            withdraw : function(money){
                this.balance -= money;
                return money;
            }

        }
    </script>
</head>
<body>
    <h3>리터럴 표기법으로 객체 만들기</h3>
    <hr>
    <script>
       document.write("account : ");
       document.write(account.owner + ", " + account.code + ", " + account.balance + "<br>");

       account.deposit(10000);
       document.write("10000원 저금 -> " + account.inquiry() + "<br>");
       account.withdraw(5000);
       document.write("5000원 인출 후 금액 -> " + account.inquiry() + "<br>");

    </script>
</body>    
</html>
