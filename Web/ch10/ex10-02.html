<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>윈도우 열기</title>
    <script>
        let newWin = null;
        function load(url){
            newWin = window.open(url, "myWin", "left=300, top=300, width=400, height=300");
        }
        function close(){
            if(newWin == null || newWin.closed)
                return;
            else
                newWin.close();
        }
    </script>
</head>
<body>
    <h3>window.open()으로 윈도우 열기</h3>
    <hr>
    <a href="javascript:load('http://www.graceland.com')">엘비스 프레슬리 홈 페이지</a><br>
    <a href="javascript:window.close()">현재 윈도우 닫기</a><br>
    <a href="javascript:close()">새 윈도우 닫기</a>
</body>
</html>
