<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>웹 페이지 프린트</title>
</head>
<body>
    <h3>웹 페이지 프린트</h3>
    <hr>
    <p>window 객체의 print() 메소드를 호출하면 window 개겣에 담겨 있는 웹 페이지가 프린트 됨</p>
    <a href="#" onclick="window.print()">이곳을 누르면 프린트</a><br>
    <button onclick="window.print()">프린트</button>
    
</body>
</html>
