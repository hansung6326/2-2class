<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>워커 태스크 만들기</title>
</head>
<body>
    <h3>제출자: 안태호</h3>
    <h3>학점 매기기</h3>
    <hr>
    <button id="score" onclick="score()">점수 입력</button>
    <div id="div"></div>
    <script>
        let ret;
        let div = document.getElementById("div");
        let addWorker = new Worker("score.js");
        function score(){
            ret = prompt("점수를 숫자로 입력하세요");
            addWorker.postMessage(parseInt(ret));
        }
        addWorker.onmessage = function (e){
            div.innerHTML = ret + "=" + e.data;
        }

    </script>
</body>
</html>
