<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr10</title>
    <script>
        function openWin(){
            let win = window.open("", "" , "left=500, top=400, width=300, height=300"); //win.moveTo()
            win.document.write("접속 감사합니다!");
            win.document.write("<br>열심히 하세요!");
            win.document.body.style.background = "yellowgreen";
            win.document.title = "환영";
            
            win.document.close();
        }
    </script>
</head>
<body onload="openWin()">
    <h3>pr10</h3>
    <hr>
    <p>HTML5를 학습하는 사이트입니다.</p>
    
</body>
</html>
