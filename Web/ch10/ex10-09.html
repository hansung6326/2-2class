<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>웹 사이트 접속</title>
    <script>
        function load(){
            let site = document.getElementById("site");
            window.location = site.options[site.selectedIndex].value;
        }
    </script>
</head>
<body>
    <h3>웹 사이트 접속</h3>
    <hr>
    사이트 선택 : <select id="site">
        <option value="https://www.naver.com/">네이버</option>
        <option value="https://www.google.com/?hl=ko">구글</option>
        <option value="https://kr.tradingview.com/">트레이딩 뷰</option>
    </select>
    <button onclick="load()">접속</button>
    
</body>
</html>
