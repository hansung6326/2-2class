<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>산수를 풀어봅시다</title>
    <style>
        td {
            padding-left: 13px;
            padding-right: 13px;
        }
    </style>
    <script>
        let show = null;   // 타이머 ID
        let count;         // 남은 시간

        function ontime() {
            document.getElementById("grade").innerHTML = 0;
            let time = document.getElementById("time");
            count = 10;
            if (show != null)
                clearTimeout(show);
            outtime(time);
        }

        function outtime(cls) {
            count--;
            cls.innerHTML = count;
            if (count != 0)
                show = setTimeout(function () { outtime(cls); }, 1000);  // 수정: 지역 변수 cls를 그대로 넘김
            else
                correct();
        }

        function make() {
            let one = document.getElementsByClassName("one");
            let two = document.getElementsByClassName("two");
            for (let i = 0; i < one.length; i++) {
                let num1 = Math.floor(Math.random() * 99);
                let num2 = Math.floor(Math.random() * 99) + 1;   // 수정: 0으로 나누지 않도록 1~99
                let op = Math.floor(Math.random() * 4);
                let operator;
                switch (op) {
                    case 0: operator = "+"; break;
                    case 1: operator = "-"; break;
                    case 2: operator = "*"; break;
                    case 3: operator = "/"; break;
                }
                one[i].innerHTML = num1 + operator + num2;
                one[i].style.textDecoration = "none";   // 수정: 이전 채점의 줄 지우기
                two[i].value = "";                      // 수정: 이전 답 지우기
            }
        }

        function correct() {
            let countgrade = 0;
            let one = document.getElementsByClassName("one");
            let two = document.getElementsByClassName("two");
            for (let i = 0; i < one.length; i++) {
                let question = one[i].innerHTML;
                let answer = two[i].value;
                let ans = Math.floor(eval(question));   // 수정: 함수 이름과 겹치던 변수 이름 변경
                if (answer != "" && !isNaN(answer) && parseInt(answer) == ans)
                    countgrade += 1;
                else
                    one[i].style.textDecoration = "line-through";
            }
            document.getElementById("grade").innerHTML = countgrade;
        }
    </script>
</head>
<body onload="ontime(); make()">
    <h3>산수 문제를 풀어 봅시다.</h3>
    문제는 자동으로 생성되며, 10초가 지나면 자동 채점됩니다.
    <div>
        남은 시간 <span id="time">0</span>
    </div>
    <hr>
    <form>
        <table>
            <tr>
                <td class="one"></td>
                <td><input class="two" type="text" size="6"></td>
            </tr>
            <tr>
                <td class="one"></td>
                <td><input class="two" type="text" size="6"></td>
            </tr>
            <tr>
                <td class="one"></td>
                <td><input class="two" type="text" size="6"></td>
            </tr>
            <tr>
                <td class="one"></td>
                <td><input class="two" type="text" size="6"></td>
            </tr>
            <tr>
                <td><button type="button" onclick="ontime(); make()">다시</button></td>
                <td><span id="grade">0</span></td>
            </tr>
        </table>
    </form>
</body>
</html>
