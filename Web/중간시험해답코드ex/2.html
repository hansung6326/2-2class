<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TITLE</title>
</head>
<body>
<script>
  function even(n) {
    // 본인이 작성하라
    for(i=1; i<=n; i++) {
      if ( i%2 == 0)
        document.write(i+" ");
    }
  }

  let x = Math.random()*10;
  let n = Math.floor(x);
  document.write("1에서 "+n+ "까지 숫자중에서 <br>")
  document.write("<hr>")
  document.write("짝수는 ")
  even(n);
</script>
</body>
</html>
