<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr11</title>
    <script>
        function drawPolygon(context, xs, ys){
            context.beginPath();
            context.moveTo(xs[0], ys[0]);
            for(let i=1; i<xs.length; i++){
                context.lineTo(xs[i], ys[i]);
            }
            context.closePath();
            context.stroke();
        }
    </script>
</head>
<body>
    <h3>pr11</h3>
    <hr>
    <canvas id="myCanvas" width="300" height="220" style="background-color: aliceblue;"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context =canvas.getContext("2d");
        let xs = [100, 10, 150, 210];
        let ys = [10, 100, 200, 60];
        drawPolygon(context, xs, ys);
    </script>
</body>
</html>
