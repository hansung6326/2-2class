<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>폼으로 원호 그리기</title>
    <style>
        td {
            text-align: right;
            padding-left: 5px;
            padding-right: 5px;
        }
    </style>
    <script>
        function draw() {
            let canvas = document.getElementById("myCanvas");
            let context = canvas.getContext("2d");
            let x = parseInt(document.getElementById("x").value);
            let y = parseInt(document.getElementById("y").value);
            let radius = parseInt(document.getElementById("radius").value);
            let sel = document.getElementById("direction");
            let direction = (sel.options[sel.selectedIndex].value == "반시계방향");  // 반시계면 true
            let start = parseInt(document.getElementById("start").value) * Math.PI / 180;  // 도 → 라디안
            let end = parseInt(document.getElementById("end").value) * Math.PI / 180;

            context.beginPath();
            context.lineWidth = parseInt(document.getElementById("lineWidth").value);
            context.strokeStyle = document.getElementById("strokeStyle").value;
            context.arc(x, y, radius, start, end, direction);
            context.stroke();
        }
        function erase() {
            let canvas = document.getElementById("myCanvas");
            let context = canvas.getContext("2d");
            context.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</head>
<body>
    <h3>폼으로 원호 그리기</h3>
    <hr>
    <form>
        <table>
            <tr>
                <td>x <input id="x" type="number" value="100"></td>
                <td>y <input id="y" type="number" value="100"></td>
            </tr>
            <tr>
                <td>반지름 <input id="radius" type="number" value="50"></td>
                <td>방향 <select id="direction">
                        <option>시계방향</option>
                        <option>반시계방향</option>
                    </select></td>
            </tr>
            <tr>
                <td>시작각도 <input id="start" type="number" value="0"></td>
                <td>끝각도 <input id="end" type="number" value="270"></td>
            </tr>
            <tr>
                <td>선굵기 <input id="lineWidth" type="number" value="1"></td>
                <td>선색 <input id="strokeStyle" type="color" value="#000000"></td>
            </tr>
            <tr>
                <td><button type="button" onclick="draw()">그리기</button></td>
                <td><button type="button" onclick="erase()">지우기</button></td>
            </tr>
        </table>
    </form>
    <canvas id="myCanvas" width="500" height="200" style="background-color:aliceblue;"></canvas>
</body>
</html>
