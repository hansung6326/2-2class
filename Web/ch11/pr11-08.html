<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
</head>    
<body onload="init()">
    <canvas id="myCanvas" width="500" height="420" style="background-color:aliceblue"></canvas><br>
	선굵기 : <input id="lw" type="text" size="5" value="2"> 선 색 : <input id="color" type="color">
    <script>
        let canvas, context;
        function init(){
            canvas = document.getElementById("myCanvas");
            context = canvas.getContext("2d");

            canvas.addEventListener("mousemove", function (e){move(e)}, false);
            canvas.addEventListener("mousedown", function (e){down(e)}, false);
            canvas.addEventListener("mouseup", function (e){up(e)}, false);
            canvas.addEventListener("mouseout", function (e){out(e)}, false);
        }

        let startX = 0;
        let startY = 0;
        let dragging = false;

        function draw(curX, curY){
			context.lineWidth = parseInt(document.getElementById("lw").value);
            context.strokeStyle = document.getElementById("color").value;
            context.beginPath();
            context.moveTo(startX, startY);
            context.lineTo(curX, curY);
            context.stroke();
        }

        function down(e){
            startX = e.offsetX;
            startY = e.offsetY;
            dragging = true;
        }
        function up(e){
            dragging = false;
        }
        function move(e){
            if(!dragging)
                return;
            let curX = e.offsetX;
            let curY = e.offsetY;
            draw(curX, curY);
            startX = curX;
            startY = curY;
        }
        function out(e){
            dragging = false;
        }

    </script>
</body>
</html>
