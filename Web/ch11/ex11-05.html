<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
</head>    
<body>
    <canvas id="myCanvas" width="200" height="150" style="background-color:aliceblue"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        context.beginPath();
        context.strokeStyle = "magenta";
        for(let i=0; i<5; i++){
            context.rect(10+i*30, 10+i*10, 50, 50);
        }
        context.stroke();

    </script>
</body>
</html>
