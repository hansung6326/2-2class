<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
</head>    
<body>
    <canvas id="myCanvas" width="200" height="420" style="background-color:aliceblue"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        context.fillStyle = "violet";
        context.fillRect(20, 20, 100, 100);

        context.beginPath();
        context.rect(20, 150, 100, 100);
        context.fillStyle = "violet";
        context.fill();

        context.strokeStyle = "gray";
        context.lineWidth = 10;
        context.stroke();

        context.beginPath();
        context.moveTo(80, 340);
        context.arc(80, 340, 50, 0, 3*Math.PI/2, false);
        context.closePath();
        
        context.fillStyle = "yellowgreen";
        context.fill();

        context.strokeStyle = "gray";
        context.lineWidth = 10;
        context.stroke();


    </script>
</body>
</html>
