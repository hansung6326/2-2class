<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
</head>    
<body>
    <canvas id="myCanvas" width="250" height="150" style="background-color: aliceblue;"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        context.beginPath();
        context.strokeStyle = "blue";
        context.rect(30, 30, 50, 50);
        context.stroke();

        context.beginPath();
        context.fillStyle = "violet";
        context.rect(60, 60, 50, 50);
        context.fill();

        context.font = "20px Gothic";
        context.fontStyle = "green";
        context.fillText("Text in Canvas", 100, 50);
    </script>
</body>
</html>
