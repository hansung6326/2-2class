<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr11</title>
</head>
<body>
    <h3>pr11</h3>
    <hr>
    <canvas id="myCanvas" width="500" height="420" style="background-color: aliceblue;"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context =canvas.getContext("2d");
        context.lineWidth = 5;
        context.beginPath();
        context.strokeStyle = "lightblue";
        context.arc(50, 150, 50, 0, 2*Math.PI);
        context.stroke();
        context.beginPath();
        context.strokeStyle = "yellow";
        context.arc(100, 190, 50, 0, 2*Math.PI);
        context.stroke();
        context.beginPath();
        context.strokeStyle = "black";
        context.arc(150, 150, 50, 0, 2*Math.PI);
        context.stroke();
        context.beginPath();
        context.strokeStyle = "green";
        context.arc(200, 190, 50, 0, 2*Math.PI);
        context.stroke();
        context.beginPath();
        context.strokeStyle = "red";
        context.arc(250, 150, 50, 0, 2*Math.PI);
        context.stroke();
    </script>
</body>
</html>
