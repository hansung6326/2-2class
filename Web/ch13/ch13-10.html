<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>타이머를 가진 워커 태스크</title>
</head>
<body>
    <h3>타이머를 가진 워커 태스크</h3>
    <hr>
    <div>
        <span id="timer">타이머카운트</span>
    </div>
    <button id="start" onclick="start()">start</button>
    <button id="stop" onclick="stop()">stop</button>

    <script>
        let addWorker = new Worker("timer.js");

        addWorker.onmessage = function (e){
            document.getElementById("timer").innerHTML = e.data;
        }
        function start(){
            addWorker.postMessage("start");
        }
        function stop(){
            addWorker.postMessage("stop");
        }

    </script>

</body>
</html>
