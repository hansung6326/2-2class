<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>1~10까지 더하는 워크 테스크</title>
</head>
<body>
    <h3>1~10까지 더하는 워크 테스크</h3>
    <hr>
    <div>1에서 10 까지의 합은 <span id="sum"></span></div>

    <script>
        let addWorker = new Worker("add1to10.js");

        addWorker.onmessage = function (e){
            document.getElementById("sum").innerHTML = e.data;
        }
    </script>
</body>
</html>
