<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr08</title>
</head>
<body>
    <h3>pr08</h3>
    <ol type="A">
        <li>물을 끓인다.</li>
        <li>라면과 스프를 넣는다.</li>
        <li>파를 썰어 넣는다.</li>
        <li>5분 후 <strong>맛있게</strong> 먹는다.</li>
    </ol>
    <script>
        let li = document.getElementsByTagName("li");
        for(let i=0; i<li.length; i++){
            li[i].style.color = "green";
        }
    </script>
</body>
</html>
