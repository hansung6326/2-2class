<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr08</title>
    <style>
        div{
            position: absolute;
        }
        img{
            position: absolute;
        }
    </style>
</head>
<body>
    <h3>pr08</h3>
    <hr>
    <img src="media/spongebob.png" width="150" height="200" onclick="big(this)">
    <script>
        let i = 2;
        function big(obj){
            if(i <= 4){
                obj.style.transform = "scale(" + i +",1)";
            }
            i++;
        }
    </script>
</body>
</html>
