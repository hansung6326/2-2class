<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr08</title>
</head>
<body>
    <h3>pr08</h3>
    <hr>
    <ol type="A" style="background-color: yellowgreen;" onclick="append(this)">
        <li>물을 끓인다.</li>
    </ol>
    <script>
        function append(obj){
            let text = prompt("라면을 끓이는 순서를 입력하라");
            if(text == null || text == "")
                return;
            let li = document.createElement("li");
            li.innerHTML = text;
            obj.appendChild(li);
        }
    </script>
</body>
</html>
