<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr07</title>
</head>
<body>
    <h3>pr07</h3>
    <hr>
    <script>
        let n = [];
        for(let i = 0; i<5; i++){
            n[i] = prompt("정수 입력");
        }
        for(let i =0; i<n.length; i++){
            document.write(n[i] + " ");
        }
        document.write("<hr>");
        n.reverse();
        for(let i =0; i<n.length; i++){
            document.write(n[i] + " ");
        }
    </script>
</body>
</html>
