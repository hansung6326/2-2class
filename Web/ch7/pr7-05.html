<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr07</title>
</head>
<body>
    <h3>pr07</h3>
    <hr>
    <script>
        let names = new Array("wonsun", "jaemoonlee", "kitae", "gracehwang");
        for(let i =0; i<names.length; i++){
            document.write(names[i] + " ");
        }
        document.write("<br>");
        let long = names[0];
        for(let i=0; i<names.length; i++){
            if(long.length < names[i].length)
                long = names[i];
        }
        document.write("가장 긴 이름 : " + long + "<br>");
        let first = names[0];
        for(let i=0; i<names.length; i++){
            if(names[i] < first)
                first = names[i];
        }
        document.write("가장 먼저 : " + first + "<br>");
        names.sort();
        for(let i=0; i<names.length; i++){
            document.write(names[i] + " ");
        }
    </script>
</body>
</html>
