<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Math를 활용한 구구단 연습</title>
    <script>
        function randomInt(){
            return Math.floor(Math.random()*9) + 1;
        }
    </script>
</head>
<body>
    <h3>Math를 활용한 구구단 연습</h3>
    <hr>
    <script>
        let ques = randomInt() + "*" + randomInt();
        let user = prompt(ques + "값은 얼마입니까?", 0);
        if(user == null)
            document.write("구구단 연습을 종료합니다");
        else{
            let ans = eval(ques);
            if(ans == user){
                document.write("정답! ");
            }else{
                document.write("틀렸습니다! ");
            }
            document.write(ques + "=" + "<strong>" + ans + "입니다");
        }

    </script>
</body>    
</html>
