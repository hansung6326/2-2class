<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr07</title>
</head>
<body>
    <h3>pr07</h3>
    <hr>
    <script>
        let current = new Date();
        if(current.getHours() < 12)
            document.body.style.background = "lightskyblue";
        else
            document.body.style.background  = "orange";
        document.write("현재 시간 : " + current.getHours() + ":" + current.getMinutes() + ":" + current.getSeconds());
    </script>
</body>
</html>
