<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr07</title>
</head>
<body>
    <h3>pr07</h3>
    <hr>
    <script>
        let current = new Date();
        let days = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

        if(current.getDay() == 0)
            document.body.style.background = "pink";
        else
            document.body.style.background = "gold";

        document.write("오늘 : " + current.getDate() + "일, " + days[current.getDay()]);
        
    </script>
</body>
</html>
