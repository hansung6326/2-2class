<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr07</title>
</head>
<body>
    <h3>pr07</h3>
    <hr>
    <script>
        let current = new Date();

        if(current.getDay() == 0)
            document.body.style.background = "pink";
        else
            document.body.style.background = "gold";

        document.write("오늘 : " + current.getDate() + "일, ");
        switch(current.getDay()){
        case 0:
            document.write("일요일");
            break;
        case 1:
            document.write("월요일");
            break;
        case 2:
            document.write("화요일");
            break;
        case 3:
            document.write("수요일");
            break;
        case 4:
            document.write("목요일");
            break;
        case 5:
            document.write("금요일");
            break;
        case 6:
            document.write("토요일");
            break;
    }
    </script>
</body>
</html>
