<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr12</title>
    <script>
        let name = document.getElementById("name");
        let num = document.getElementById("number");
        function search(){
            if(!window.sessionStorage){
                alert("세션 스토리지를 지원하지 않습니다.");
                return;
            }
            num.value = sessionStorage.getItem(name.value);
        }
    </script>
</head>
<body>
    <h3>pr12</h3>
    <hr>
    검색할 이름 <input id="name" type="text"><br>
    검색된 학번 <input type="text" id="number"> <button onclick="search()">스토리지에 검색</button>
    <a href="pr12-01-1.html">이름으로 학번 저장 페이지로</a>
</body>
</html>
