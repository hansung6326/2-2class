<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr12</title>
    <style>
        div{
            display: inline-block;
            border: 1px solid yellowgreen;
            width: 150px;
            padding-left: 20px;
            padding-bottom: 20px;
        }
    </style>
    <script>
        function store(key, obj){
            if(!window.localStorage){
                alert("지원하지 않음");
                return;
            }
            let city = obj.option[obj.selectedIndex].value;
            localStorage.setItem(key, city);
        }
    </script>
</head>
<body>
    <h3>pr12</h3>
    <hr>
    <div>
        <p>도시를 선택하세요</p>
        <select onchange="store('city', this)" size="3">
            <option value="파리">파리</option>
            <option value="뉴욕">뉴욕</option>
            <option value="런던">런던</option>
        </select>
    </div>
</body>
</html>
