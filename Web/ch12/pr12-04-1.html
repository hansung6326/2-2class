<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr12</title>
    <script>
        function store(){
            if(!window.localStorage){
                alert("지원하지 않음");
                return;
            }
            let date = new Date();
            let str = date.toLocaleDateString();
            let memo = document.getElementById("memo");
            localStorage.setItem(str, memo.value);
        }
        function view(){
            window.open("pr12-04-2.html", "newWin");
        }
    </script>
</head>
<body>
    <h3>pr12</h3>
    <hr>
    <script>
        let date = new Date();
        let str = date.toLocaleDateString();
        document.write("오늘 " + str);
    </script><br>
    <textarea id="memo"></textarea>
    <br>
    <button onclick="store()">저장</button>
    <button onclick="view()">보기</button>

</body>
</html>
