<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>선택된 라디오버튼 알아내기</title>
<script>
function findChecked() {
	// 본인이 작성하라
	let city = document.getElementsByName("city");
	let p = document.getElementById("display");
	let found = null;
	for(let i=0; i<city.length; i++){
		if(city[i].checked == true){
			found = city[i];
		}
	}
	if(found != null)
		p.innerHTML = found.value + "이 선택되었음";
	else
		p.innerHTML = "선택된 것이 없음";
	
}
</script>
</head>
<body>
<h3>버튼을 클릭하면 선택된 라디오 버튼의 value를 출력합니다.</h3>
<hr>
<form>
	<input type="radio" name="city" value="수원" checked>수원
	<input type="radio" name="city" value="안산">안산
	<input type="radio" name="city" value="의정부">의정부
	<input type="button" value="select" onclick="findChecked()">
</form>
<p id="display"> 선택한 값은? </p> 
</body>
</html>
