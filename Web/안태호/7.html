<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>mousedown과 mouseup으로 선 그리기</title>
<script>
let canvas, context; // 전역 변수
function init() {
	canvas = document.getElementById("myCanvas");
	context = canvas.getContext("2d");
	context.lineWidth = 2; // 선 굵기를 2로 설정
	context.strokeStyle = "blue";
	canvas.addEventListener("mousemove", function (e) { move(e) }, false);
	canvas.addEventListener("mousedown", function (e) { down(e) }, false);	
	canvas.addEventListener("mouseup", function (e) { up(e) }, false);		
}

let firstX=0, firstY=0; // 마우스의 마지막 포인터 좌표
let dragging=false;
function draw(endX, endY) { // e는 MouseEvent 객체
	// 본인이 작성하라
	context.strokeStyle = "red";
	context.beginPath();
	context.moveTo(firstX, firstY);
	context.lineTo(endX, endY);
	context.stroke();

}
function move(e) {
	if(!dragging) return;
	context.clearRect(0, 0, canvas.width, canvas.height);
	let curX = e.offsetX;
	let curY = e.offsetY;
	draw(curX, curY);
}
function down(e) {
	firstX = e.offsetX;
	firstY = e.offsetY;
	dragging = true;
}
function up(e) {
	let curX = e.offsetX;
	let curY = e.offsetY;
	draw(curX, curY);
	dragging = false;
}
</script></head>
<body onload="init()">
<h3>mousedown과 mouseup으로 선 그리기</h3>
<hr>
<canvas id="myCanvas" style="background-color:aliceblue"
	 width="500" height="200"></canvas>	 
</body>
</html>
