<!--
교재 46페이지에 1개의 파일에서 HTML, CSS, Javascript 부분으로 분리된 웹페이지 만들기
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>그림판 만들기</title>
<!--
교재 163페이지에 CSS코드를 별도 파일에 작성 방법 설명
  <link href="ex14-01.css" type="text/css" rel="stylesheet">
-->
<style>
div#menu { /*id 셀렉터 */
	width : 500px; height : 50px;
	border : 1px solid lightgray;
}
div#palette { /*id 셀렉터 */
	display : inline-block;
	float : left;	
	width : 250px; 
	background-color : lightgray;
}
div.color { /* class 셀렉터 */
	display : inline-block;
	float : left;
	width : 20px; height : 20px; margin : 1px;
	border : 1px solid lightgray;
}
div#linewidth { /*id 셀렉터 */
	display : inline-block;
	float : left;	
	width : 65px; height : 48px; padding-left : 3px;
	border : 1px solid lightgray;
}
input#widthInput { /*id 셀렉터 */ margin-top : 5px; }
div#selectedColor { /*id 셀렉터 */
	display : inline-block;
	float : left;
	width : 40px; height : 47px;
	border : 1px solid lightgray;
}
div#mouselocation { /*id 셀렉터 */
	display : inline-block;
	float : right;	
	width : 60px; height : 47px; padding-left : 3px;
}
input[type=color] { /*속성 셀럭터 */
	display : inline-block;
	float : left;
	width :40px; height : 18px;
	border-radius : 3px;
	border : 2px solid skyblue;
}
</style>
<!--
교재 262페이지에 Javascript코드를 별도 파일에 작성 방법 설명
  <script src="ex14-01.js"></script>
-->
<script>
let canvas, context; // 전역 변수
let colorInputObj, widthInputObj, mouseLocationObj;
let lineWidth;
let strokeColor;

function init() {
	canvas = document.getElementById("myCanvas");
	context = canvas.getContext("2d");
	widthInputObj = document.getElementById("widthInput");	
	lineWidth =  widthInputObj.value;
	
	colorInputObj = document.getElementById("colorInput");
	colorInputObj.onchange = function (e) { // 사용자가 지금 선택한 색으로 strokeColor 변경
		strokeColor=e.target.value;
		selectedColor.style.backgroundColor = strokeColor;	
	}
	colorInputObj.onclick = function (e) { // 클릭하면 현재 색으로 strokeColor 변경
		strokeColor=e.target.value;
		selectedColor.style.backgroundColor = strokeColor;	
	}
	selectedColor = document.getElementById("selectedColor");
	strokeColor = colorInputObj.value;
	selectedColor.style.backgroundColor = strokeColor;
	
	mouseLocationObj = document.getElementById("mouseLocation");	

	// 컬러 팔레트 안에 있는 모든 색상 <div> 태그에 onclick 리스너를 등록한다
	let colorObjs = document.getElementsByClassName("color");
	for(let i=0; i<colorObjs.length; i++) {
		colorObjs[i].onclick = function (e) {  // 사용자가 선택한 색으로 strokeColor 변경
			let obj = e.target;
			strokeColor = obj.style.backgroundColor;
			selectedColor.style.backgroundColor = strokeColor;
		}
	}
	
	// 마우스 리스너를 캔버스에 등록한다.
	canvas.addEventListener("mousemove", function (e) { move(e) }, false);
	canvas.addEventListener("mousedown", function (e) { down(e) }, false);
	canvas.addEventListener("mouseup", function (e) { up(e) }, false);
	canvas.addEventListener("mouseout", function (e) { out(e) }, false);
}

let startX=0; startY=0; // 마우스의 마지막 포인터 좌표
let drawing=false;

function draw(curX, curY) { // e는 MouseEvent 객체
	context.beginPath();
	context.lineWidth = lineWidth;
	context.strokeStyle = strokeColor;	
	context.moveTo(startX, startY);
	context.lineTo(curX, curY);
	context.stroke();
}
function down(e) { 
	startX = e.offsetX; startY = e.offsetY;
	drawing = true;
}
function up(e) { drawing = false; }
function move(e) {
	// 마우스 포인터의 위치 출력
	mouselocation.innerHTML = "x="+e.offsetX + "<br>y=" + e.offsetY;
	if(!drawing) 
		return; // 마우스가 눌러지지 않았으면 리턴
	let curX = e.offsetX, curY = e.offsetY;
	draw(curX, curY);	
	startX = curX; startY = curY;
}
function out(e) { drawing = false; }
</script>
</head>
<body onload="init()">
<h3>그림판입니다. 그림을 그려보세요</h3>
<hr>
<div id="menu">
	<div id="palette">
		<div class="color" style="background-color:maroon"></div>
		<div class="color" style="background-color:red"></div>
		<div class="color" style="background-color:orange"></div>
		<div class="color" style="background-color:yellow"></div>
		<div class="color" style="background-color:olive"></div>
		<div class="color" style="background-color:purple"></div>
		<div class="color" style="background-color:fuchsia"></div>
		<div class="color" style="background-color:white"></div>
		<input type="color" id="colorInput" value="#00ff00">
		<div class="color" style="background-color:lime; clear:both"></div>
		<div class="color" style="background-color:green"></div>
		<div class="color" style="background-color:navy"></div>
		<div class="color" style="background-color:aqua"></div>
		<div class="color" style="background-color:teal"></div>
		<div class="color" style="background-color:black"></div>
		<div class="color" style="background-color:silver"></div>
		<div class="color" style="background-color:gray"></div>
		<div class="color" style="background-color:white"></div>		
		<div class="color" style="background-color:white"></div>		
	</div>
	<div id="linewidth">선굵기
		<input type="number" id="widthInput" value="1" min="0" max="20" step="1" 
				onchange="lineWidth=this.value">
	</div>
	<div id="selectedColor" title="그리기 선 색입니다."></div>
	<div id="mouselocation"></div>
</div>
<canvas id="myCanvas" style="background-color:aliceblue" width="500" height="400">
</canvas>
</body>
</html>
