<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>pr06</title>
</head>
<body>
    <h3>pr06</h3>
    <hr>
    <script>
        function big(a, b){
            let x = parseInt(a);
            let y = parseInt(b);
            if(x > y)
                return x;
            return y;
        }
    </script>
    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>
