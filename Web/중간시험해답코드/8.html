<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TITLE</title>
<script>
function search() {
	// 본인이 작성하라
	if(!window.sessionStorage) { alert("지원하지 않습니다."); return;}
	let key = document.getElementById("key").value;
	let name = sessionStorage.getItem(key);
	if(name == null) {
		alert(key + " 과일이 없습니다."); return;
	}

	document.getElementById("name").value = name;
}
</script>
</head>
<body>
<h3>과일명으로 개수  검색</h3>
<hr>
<form>
<label>검색할 과일명 <input id="key" type="text" size="10"></label>
<br>
<label>검색된 개수 <input id="name" type="text" size="10"></label>
<input type="button" value="스토리지에서 검색" onclick="search()">
</form>
<br>
<a href="8-1.html">과일명과 개수 저장 페이지로</a>
</body>
</html>
