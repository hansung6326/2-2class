<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>프로토타입으로 객체 만들기</title>
    <script>
        function Account(owner, code, balance){
            this.owner = owner;
            this.code = code;
            this.balance = balance;

            this.inquiry = function(){
                return this.balance;
            }
            this.deposit = function(money){
                this.balance += money;
            }
            this.withdraw = function(money){
                this.balance -= money;
                return money;
            }
        }
    </script>
</head>
<body>
    <h3>프로토타입으로 객체 만들기</h3>
    <hr>
    <script>
       let account = new Account("안태호", "111", 35000);

       document.write("account : ");
       document.write(account.owner + ", " + account.code + ", " + account.balance + "<br>");

       account.deposit(10000);
       document.write("10000원 저금 -> " + account.inquiry() + "<br>");
       account.withdraw(5000);
       document.write("5000원 인출 후 금액 -> " + account.inquiry() + "<br>");

    </script>
</body>    
</html>
