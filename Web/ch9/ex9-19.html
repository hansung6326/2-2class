<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>select 객체에서 선택한 이미지 출력</title>
    <script>

        function drawImage(){
            let sel = document.getElementById("fruits");
            let img = document.getElementById("fruitimage");
            img.src = sel.options[sel.selectedIndex].value;
        }
    </script>
</head>
<body onload="drawImage()">
    <h3>select 객체에서 선택한 이미지 출력</h3>
    <hr>
    <form>
        <select id="fruits" onchange="drawImage()">
            <option value="media/apple.jpg">사과</option>
            <option value="media/banana.png">바나나</option>
            <option value="media/puppy.jpg" selected>강아지</option>
        </select>
        <img id="fruitimage" src="media/banana.png" alt="">
    </form>
    
</body>
</html>
