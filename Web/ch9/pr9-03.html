<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr09</title>
</head>
<body>
    <h3>pr09</h3>
    <hr>
    수식을 입력하고 &lt;Enter&gt;를 입력하세요
    <br>
    식 <input id="exp" type="text" onkeydown="cal(event)"><br>
    값 <input id="res" type="text">
    <script>
        let exp = document.getElementById("exp");
        let res = document.getElementById("res");
        function cal(e){
            if(e.key == "Enter"){
                res.value = eval(exp.value);
            }
        }
    </script>
</body>
</html>
