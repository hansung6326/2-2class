<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr09</title>
    <script>
        let prev = null;
        window.onclick = function (e){
            if(e.target.tagName != "LI"){
                return;
            }
            if(prev != null)
                prev.style.fontSize = "1em";
            e.target.style.fontSize = "1.3em";
            prev = e.target;
        }
    </script>
</head>
<body>
    <h3>pr09</h3>
    <hr>
    <p>여름 방학 때 하고 싶은 것들</p>
    <ul>
        <li>자전거로 대한민국 일주</li>
        <li>책 100권 읽기</li>
        <li>철인 3종 경기 준비</li>
        <li>자바스크립트 정복</li>
    </ul>
</body>
</html>
