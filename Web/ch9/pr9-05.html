<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr09</title>
</head>
<body>
    <h3>pr09</h3>
    <hr>
    바탕 아무 곳이나 더블클릭하면 배경색이 랜덤하게 변합니다.
    <script>
        document.ondblclick = function (){
            let r = Math.floor(Math.random()*256);
            let g = Math.floor(Math.random()*256);
            let b = Math.floor(Math.random()*256);
            document.body.style.background = "rgb(" + r + "," + g + "," + b + ")";
        }
    </script>
</body>
</html>
