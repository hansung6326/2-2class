<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pr09</title>
    <script>
        window.onmouseover = function (e){
            if(e.target.tagName == "SPAN"){
                e.target.style.textDecoration = "underline";
            }
        }
        window.onmouseout = function (e){
            if(e.target.tagName == "SPAN"){
                e.target.style.textDecoration = "none";
            }
        }
    </script>
</head>
<body>
    <h3>pr09</h3>
    <hr>
    <p>span 태그에 대해서만 <span>마우스</span>가 올라올 때 밑줄이 그어지고 <span>마우스</span>가 내려갈 때 밑줄이 사라지도록
    <span>자바스크립트 코드</span>를 작성한다.</p>
</body>
</html>
